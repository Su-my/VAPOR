[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vapor-vl"
version = "0.1.0"
description = "Visual attention persistence with on-demand refresh for multimodal reasoning"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.12,<3.13"
authors = [{name = "Mingyu Su", email = "sumy25@mails.tsinghua.edu.cn"}]
dependencies = ["torch==2.8.0", "transformers==4.57.6", "triton==3.4.0", "numpy>=1.26", "Pillow>=10", "ninja"]

[project.optional-dependencies]
internvl = ["torchvision==0.23.0", "timm>=1.0,<2", "einops>=0.8"]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"vapor._backend.qwen" = ["*.cpp"]
"vapor._backend.internvl" = ["*.cpp"]
